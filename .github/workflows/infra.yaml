on:
  workflow_dispatch:
    inputs:
      region:
        description: 'choose the region to deploy the infra'
        required: true
        default: 'eu-north-1'
        type: choice
        options:
          - eu-north-1
          - eu-west-2
      environment:
        description: 'choose the environment to deploy the infra'
        required: true
        type: choice
        options:
          - dev
          - prod
      workspace:
        description: 'insert the workspace to deploy the infra'
        required: true
        type: string
        default: ${{ github.event.inputs.region }}.${{ github.event.inputs.environment }}

        
env:
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}  # TODO define this secret in your GitHub repo settings
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}  # TODO define this secret in your GitHub repo settings
  AWS_PUBLIC_KEY_TF : ${{ secrets.AWS_PUBLIC_KEY_TF }}  # TODO define this secret in your GitHub repo settings
  PATH_TF: "/home/runner/work/NetflixInfra/NetflixInfra/tf"

jobs:
  infra-plan:
    runs-on: ubuntu-latest   
    environment: manual-approval  # <-- Requires manual approval before continuing
    steps:
      - name: Checkout the app code
        uses: actions/checkout@v2
      
      - name: setup Terraform
        uses: hashicorp/setup-terraform@v2
        
      - name: Modify Public Key in Terraform File
        run: |
          sed -i 's|public_key = file(".*")|public_key = "${{ secrets.AWS_PUBLIC_KEY_TF }}"|' tf/main.tf

      - name: configure AWS credentials
        run: |
          aws configure set aws_access_key_id $AWS_ACCESS_KEY_ID
          aws configure set aws_secret_access_key $AWS_SECRET_ACCESS_KEY
          aws configure set region ${{ github.event.inputs.region }}
      
      - name: Initialize Terraform
        run: |
          cd $PATH_TF
          terraform init

      - name: Terraform workspace
        run: |
          cd $PATH_TF
          WORKSPACE_NAME=${{ github.event.inputs.workspace }}
          if terraform workspace list | grep -q "\b$WORKSPACE_NAME\b"; then
            terraform workspace select $WORKSPACE_NAME
          else
            terraform workspace new $WORKSPACE_NAME
            terraform workspace select $WORKSPACE_NAME
          fi
      
      - name: Terraform plan
        run: |
          cd $PATH_TF
          terraform plan -var-file=$PATH_TF/region.${{ github.event.inputs.region }}.${{ github.event.inputs.environment }}.tfvars
  
  manual-approval:
    name: Manual Approval
    runs-on: ubuntu-latest
    needs: terraform-plan
    if: success() # Only proceed if terraform-plan job succeeds
    
    permissions:
      issues: write

    steps:
      - name: Await Manual Approval
        uses: trstringer/manual-approval@v1
        with:
          secret: ${{ github.TOKEN }}
          approvers: user1,user2,user3,group1,group2 # Replace with GitHub usernames, with the free version you can only have an issue assigned to one username
          minimum-approvals: 1
          issue-title: "Manual Approval Required for Terraform Apply"
          issue-body: "Please approve or deny the deployment."

  infra-apply:
    runs-on: ubuntu-latest   
    steps:
      - name: Checkout the app code
        uses: actions/checkout@v2
      
      - name: setup Terraform
        uses: hashicorp/setup-terraform@v2
        
      - name: Modify Public Key in Terraform File
        run: |
          sed -i 's|public_key = file(".*")|public_key = "${{ secrets.AWS_PUBLIC_KEY_TF }}"|' tf/main.tf

      - name: configure AWS credentials
        run: |
          aws configure set aws_access_key_id $AWS_ACCESS_KEY_ID
          aws configure set aws_secret_access_key $AWS_SECRET_ACCESS_KEY
          aws configure set region ${{ github.event.inputs.region }}
      
      - name: Initialize Terraform
        run: |
          cd $PATH_TF
          terraform init

      - name: Terraform workspace
        run: |
          cd $PATH_TF
          WORKSPACE_NAME=${{ github.event.inputs.workspace }}
          if terraform workspace list | grep -q "\b$WORKSPACE_NAME\b"; then
            terraform workspace select $WORKSPACE_NAME
          else
            terraform workspace new $WORKSPACE_NAME
            terraform workspace select $WORKSPACE_NAME
          fi
      
      - name: Terraform apply
        run: |
          cd $PATH_TF
          terraform apply -var-file=$PATH_TF/region.${{ github.event.inputs.region }}.${{ github.event.inputs.environment }}.tfvars -auto-approve
        