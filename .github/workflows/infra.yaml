on:
  workflow_dispatch:
    inputs:
      region:
        description: 'choose the region to deploy the infra'
        required: true
        default: 'eu-north-1'
        type: choice
        options:
          - eu-north-1
          - eu-west-2
      environment:
        description: 'choose the environment to deploy the infra'
        required: true
        type: choice
        options:
          - dev
          - prod

        
env:
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}  # TODO define this secret in your GitHub repo settings
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}  # TODO define this secret in your GitHub repo settings
  AWS_PUBLIC_KEY_TF : ${{ secrets.AWS_PUBLIC_KEY_TF }}  # TODO define this secret in your GitHub repo settings
  PATH_TF: "/home/runner/work/NetflixInfra/NetflixInfra/tf"

jobs:
  Infra_Plan::
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the app code
        uses: actions/checkout@v2
      
      - name: setup Terraform
        uses: hashicorp/setup-terraform@v2
        
      - name: Modify Public Key in Terraform File
        run: |
          sed -i 's|public_key = file(".*")|public_key = "${{ secrets.AWS_PUBLIC_KEY_TF }}"|' tf/main.tf

      - name: configure AWS credentials
        run: |
          aws configure set aws_access_key_id $AWS_ACCESS_KEY_ID
          aws configure set aws_secret_access_key $AWS_SECRET_ACCESS_KEY
          aws configure set region ${{ github.event.inputs.region }}
      
      - name: Initialize Terraform
        run: |
          cd $PATH_TF
          terraform init

      - name: Terraform workspace
        run: |
          cd $PATH_TF
          WORKSPACE_NAME=${{ github.event.inputs.region }}.${{ github.event.inputs.environment }}
          if terraform workspace list | grep -q "\b$WORKSPACE_NAME\b"; then
            terraform workspace select ${{ github.event.inputs.region }}.${{ github.event.inputs.environment }}
          else
            terraform workspace new ${{ github.event.inputs.region }}.${{ github.event.inputs.environment }}
            terraform workspace select ${{ github.event.inputs.region }}.${{ github.event.inputs.environment }}
          fi
      
      - name: Terraform plan
        id: plan
        run: |
          cd $PATH_TF
          terraform plan -var-file=$PATH_TF/region.${{ github.event.inputs.region }}.${{ github.event.inputs.environment }}.tfvars | tee plan_output.txt

      
      - name: Upload Terraform Plan Output
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan
          path: $PATH_TF/plan_output.txt
        
Infra_Apply:
    needs: Infra_Plan
    runs-on: ubuntu-latest
    environment: manual-approval
    steps:
      - name: Download Terraform Plan Output
        uses: actions/download-artifact@v4
        with:
          name: terraform-plan
          path: $PATH_TF

      - name: Show Terraform Plan Output
        run: cat $PATH_TF/plan_output.txt

      - name: Manual approval
        uses: hmarr/auto-approve-action@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure AWS credentials
        run: |
          aws configure set aws_access_key_id $AWS_ACCESS_KEY_ID
          aws configure set aws_secret_access_key $AWS_SECRET_ACCESS_KEY
          aws configure set region ${{ github.event.inputs.region }}

      - name: Terraform apply
        run: |
          cd $PATH_TF
          terraform apply -var-file=$PATH_TF/region.${{ github.event.inputs.region }}.${{ github.event.inputs.environment }}.tfvars -auto-approve

