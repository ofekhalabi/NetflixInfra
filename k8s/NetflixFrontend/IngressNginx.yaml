---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  labels:
  name: nginx-ingress
  namespace: default
spec:
  ingressClassName: nginx
  rules:
    - host: ofekhnetflix.devops-int-college.com
      http:
        paths:
          - backend:
              service:
                name: netflix-frontend-service
                port:
                  number: 3000
            path: /
            pathType: Prefix
  tls:
    - hosts:
        - ofekhnetflix.devops-int-college.com
      secretName: tls-secret