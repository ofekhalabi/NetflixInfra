apiVersion: apps/v1
kind: Deployment
metadata:
  name: netflixmoviecatalog-dev
  labels:
    app: netflixmoviecatalog-dev
spec:
  replicas: 2
  selector:
    matchLabels:
      app: netflixmoviecatalog-dev
  template:
    metadata:
      labels:
        app: netflixmoviecatalog-dev
    spec:
      containers:
        - name: server
          image: ofekhalabi/netflix-movie-catalog:16
---
apiVersion: v1
kind: Service
metadata:
  name: netflixmoviecatalog-service-dev
spec:
  selector:
    app: netflixmoviecatalog-dev
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
  template:
    spec:
      containers:
        - image: ofekhalabi/netflix-movie-catalog:16
