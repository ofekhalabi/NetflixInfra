apiVersion: apps/v1
kind: Deployment
metadata:
  name: netflixmoviecatalog
  labels:
    app: netflixmoviecatalog
spec:
  replicas: 2
  selector:
    matchLabels:
      app: netflixmoviecatalog
  template:
    metadata:
      labels:
        app: netflixmoviecatalog
    spec:
      containers:
        - name: server
          image: ofekhalabi/netflix-movie-catalog:23
          resources:
            requests:
              cpu: 50m
              memory: 150Mi
            limits:
              cpu: 50m
              memory: 150Mi
            livenessProbe:
              initialDelaySeconds: 10
              periodSeconds: 10
              failureThreshold: 3
              httpGet:
                path: "/live"
                port: 8080
            readinessProbe:
              initialDelaySeconds: 5
              periodSeconds: 10
              failureThreshold: 3
              httpGet:
                path: "/ready"
                port: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: netflixmoviecatalog-service
spec:
  selector:
    app: netflixmoviecatalog
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
